global: { scrape_interval: 15s, evaluation_interval: 15s }
rule_files: ["/etc/prometheus/rules/*.yml"]
scrape_configs:
  - job_name: tag-observe-app
    static_configs: [{ targets: ["127.0.0.1:18130"], labels: { service: tag-observe } }]
    metrics_path: /metrics
  - job_name: tag-observe-worker
    static_configs: [{ targets: ["127.0.0.1:18133"], labels: { service: tag-worker } }]
    metrics_path: /metrics
  - job_name: prometheus
    static_configs: [{ targets: ["127.0.0.1:19090"] }]

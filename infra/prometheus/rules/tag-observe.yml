groups:
  - name: tag-observe
    rules:
      - alert: TagJobFailures
        expr: sum by (exported_job) (increase(tag_job_runs_total{status="failed"}[1h])) > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Background job {{ $labels.exported_job }} failed in the last hour" }
      - alert: TagRankingStale
        expr: increase(tag_job_runs_total{job="tag-observe-worker",exported_job="ranking",status="ok"}[30m]) == 0
        for: 30m
        labels: { severity: critical }
        annotations: { summary: "No successful ranking job in 30 minutes" }
      - alert: TagCrawlMostlyFailing
        expr: sum(increase(tag_job_runs_total{job="tag-observe-worker",exported_job=~"crawl.*",status="failed"}[2h])) > 3
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Crawl jobs failing repeatedly" }
      - alert: TagAppDown
        expr: up{job="tag-observe-app"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "tag.observe.tw app metrics endpoint down" }
      - alert: TagWorkerDown
        expr: up{job="tag-observe-worker"} == 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "tag worker metrics endpoint down" }

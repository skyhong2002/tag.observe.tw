name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: tag_test }
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DB_URL: mysql://root:root@127.0.0.1:3306/tag_test
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm ci --prefix web --ignore-scripts
      - run: npx tsc --noEmit -p web/tsconfig.tests.json
      - run: npx biome ci .
      - run: npx tsc -p tsconfig.json
      - run: npx vitest run
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  web:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.15.0', cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Test artifact boundaries
        working-directory: .
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      # Pages must build with the API unreachable (data is fetched at request time).
      - run: npx next build
        env: { TAG_API_ORIGIN: 'http://127.0.0.1:1', NEXT_TELEMETRY_DISABLED: '1' }
      - name: Package and verify standalone candidate
        working-directory: .
        run: python3 tools/ci/package_web.py
      # PR merge-ref builds exercise the packager, but are never published as candidates.
      - name: Retain exact main push candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tag-web-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/web-candidate/web-standalone.tar.gz
            artifacts/web-candidate/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
